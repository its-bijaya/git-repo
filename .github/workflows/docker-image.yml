name: Build and Push Docker Image

on:
  push:
    branches:
      - release/stage
      - release/prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Set the image tag based on the branch
      - name: Set Image Tag
        id: set-tag
        run: |
          if [[ "${{ github.ref_name }}" == "release/stage" ]]; then
            echo "tag=stage" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "release/prod" ]]; then
            echo "tag=prod" >> $GITHUB_ENV
          else
            echo "Unsupported branch!"
            exit 1
          fi

      # Build the Docker image
      - name: Build Docker Image
        run: |
          docker build -t itsbijaya/git-repo:${{ env.tag }} .

      # Push the Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push itsbijaya/git-repo:${{ env.tag }}
